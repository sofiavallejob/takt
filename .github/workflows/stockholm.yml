# Rebuilds the Stockholm metro timetable every morning.
#
# The live feed names trips by the ids in that day's national static GTFS, so
# data/sto/ has to follow it. Needs the repository secret TRAFIKLAB_STATIC_KEY
# (a Trafiklab key for "GTFS Sweden 3 Static data").

name: Stockholm timetable

on:
  schedule:
    - cron: '30 5 * * *'      # 07:30 in Stockholm in summer, 06:30 in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download GTFS Sweden 3
        run: |
          curl -sSf --retry 3 -H 'Accept-Encoding: gzip' -o sweden.zip \
            "https://opendata.samtrafiken.se/gtfs-sweden/sweden.zip?key=${{ secrets.TRAFIKLAB_STATIC_KEY }}"
      - name: Cut it down to the metro
        run: python3 tools/build_sto.py --zip sweden.zip
      - name: Commit
        run: |
          rm sweden.zip
          git config user.name 'takt-bot'
          git config user.email 'takt-bot@users.noreply.github.com'
          git add data/sto
          git diff --cached --quiet || git commit -m "Stockholm timetable $(date -u +%F)"
          git pull --rebase
          git push
