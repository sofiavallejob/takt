# Rebuilds the San Francisco rail timetable (BART and Muni) every morning.
#
# The live feeds name trips by the ids in that day's static GTFS from 511.org,
# so data/sf/ has to follow it. Needs the repository secret SF_511_KEY
# (a 511.org open data token).

name: San Francisco timetable

on:
  schedule:
    - cron: '30 10 * * *'     # 03:30 in San Francisco in summer, 02:30 in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cut BART and Muni down to the rail lines
        env:
          SF_511_KEY: ${{ secrets.SF_511_KEY }}
        run: python3 tools/build_sf.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sf
          git diff --cached --quiet || git commit -m "San Francisco timetable $(date -u +%F)"
          git pull --rebase
          git push
